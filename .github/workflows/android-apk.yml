
name: Build OpenScope APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Extract project
        run: |
          unzip -q OpenScopeOSINT_CloudBuild.zip -d project

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > project/jvm-target.gradle <<'EOF'
          gradle.projectsEvaluated {
            allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: gradle -I jvm-target.gradle :app:assembleDebug --no-daemon


      - name: Build APK
        working-directory: project
        run: gradle -I jvm-target.gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenScope-OSINT-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
